<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="format-detection"
      content="telephone=no, email=no, address=no"
    />
    <title>EnerTrack | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/sign_up/sign_up.css" />
  </head>

  <body>
    <!-- BACKGROUND -->
    <div class="background">
      <img src="../../assets/hero.png" alt="" aria-hidden="true" />
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
      <a href="../landing/landing.html" class="logo">
        <img src="../../assets/logo.png" alt="EnerTrack" />
      </a>
      <a href="../landing/landing.html" class="back-link">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        Back to site
      </a>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main">
      <!-- CARD -->
      <div class="card">
        <h1>Get started with EnerTrack</h1>
        <p class="sub">Create a free account. It takes about a minute.</p>

        <form id="signUpForm" novalidate>
          <!-- Name -->
          <div class="field">
            <label for="name">Full name</label>
            <input
              type="text"
              id="name"
              placeholder="e.g. John Doe"
              class="input"
              autocomplete="off"
            />
            <span class="field-error" id="nameError"></span>
          </div>

          <!-- Email -->
          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="e.g. john.doe@example.com"
              class="input"
              autocomplete="off"
            />
            <span class="field-error" id="emailError"></span>
          </div>

          <!-- Phone -->
          <div class="field">
            <label for="phone">Phone number</label>
            <input
              type="tel"
              id="phone"
              placeholder="e.g. 9876543210"
              class="input"
              autocomplete="off"
              maxlength="10"
            />
            <span class="field-error" id="phoneError"></span>
          </div>

          <!-- Password -->
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                placeholder="e.g. Str0ng@Pass!"
                class="input"
                autocomplete="new-password"
              />
              <span
                class="eye"
                id="togglePassword"
                onclick="togglePass()"
                aria-label="Show or hide password"
              >
                <!-- Crossed-out eye (hidden) -->
                <svg
                  id="eyeClosed"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20C6 20 1.73 14 1.73 12c0-.9.6-2.3 1.7-3.7"
                  />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6 0 10.27 6 10.27 8 0 .73-.22 1.6-.67 2.5"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
                <!-- Open eye (visible) -->
                <svg
                  id="eyeOpen"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="display: none"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <!-- Confirm Password -->
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                class="input"
                autocomplete="new-password"
              />
              <span
                class="eye"
                id="toggleConfirmPassword"
                onclick="toggleConfirmPass()"
                aria-label="Show or hide password"
              >
                <!-- Crossed-out eye (hidden) -->
                <svg
                  id="eyeClosedConfirm"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.94 10.94 0 0 1 12 20C6 20 1.73 14 1.73 12c0-.9.6-2.3 1.7-3.7"
                  />
                  <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6 0 10.27 6 10.27 8 0 .73-.22 1.6-.67 2.5"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
                <!-- Open eye (visible) -->
                <svg
                  id="eyeOpenConfirm"
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="display: none"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </span>
            </div>
            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <!-- Organisation dropdown -->
          <div class="field">
            <label for="organization">Your organisation</label>
            <div class="select-wrap">
              <select
                id="organization"
                class="input select"
                autocomplete="off"
                required
              >
                <option value="" disabled selected hidden>
                  Loading organisations...
                </option>
              </select>
              <span class="chevron">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </span>
            </div>
            <span class="field-error" id="organizationError"></span>
          </div>

          <!-- Role dropdown -->
          <div class="field">
            <label for="role">Your role</label>
            <div class="select-wrap">
              <select id="role" class="input select" autocomplete="off" required>
                <option value="" disabled selected hidden>
                  Select a role
                </option>
                <option value="Campus Visitor">Campus Visitor</option>
                <option value="Financial Analyst">Financial Analyst</option>
                <option value="Technician">Technician</option>
                <option value="Technician Administrator">
                  Technician Administrator
                </option>
                <option value="Sustainability Officer">
                  Sustainability Officer
                </option>
              </select>
              <span class="chevron">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="6 9 12 15 18 9" />
                </svg>
              </span>
            </div>
            <span class="field-error" id="roleError"></span>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn" id="signUpBtn">Sign Up</button>
        </form>

        <!-- Footer -->
        <div class="footer">
          <p>Already have an account?</p>
          <a href="../sign_in/sign_in.html" class="signin-link">Sign in</a>
        </div>
        <!--
          The other half of the door. This page joins an organisation that
          already exists; that one creates a new one and makes you its admin.
        -->
        <div class="footer">
          <p>Organisation not listed?</p>
          <a href="register_organisation.html" class="signin-link"
            >Register it</a
          >
        </div>
      </div>
    </div>

    <!-- Duplicate Account Popup -->
    <div class="popup-overlay" id="duplicatePopup" style="display: none">
      <div class="popup-card">
        <h3 id="popupTitle">Account Already Exists</h3>
        <p id="popupMsg">An account with this information already exists.</p>
        <div class="popup-actions">
          <button class="popup-btn popup-btn-secondary" id="popupClose">
            Go Back
          </button>
          <a href="../sign_in/sign_in.html" class="popup-btn popup-btn-primary"
            >Sign In Instead</a
          >
        </div>
      </div>
    </div>

    <!-- API Client -->
    <script src="../../js/shared/api.js"></script>
    <!-- Validation Logic -->
    <script src="../../js/sign_up/sign_up.js"></script>
  </body>
</html>
