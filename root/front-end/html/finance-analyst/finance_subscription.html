<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="../../css/finance-analyst/finance_overview.css" />

  </head>

  <body>
    <div style="display: flex; width: 100%">
      <div class="sidebar">

              src="../../assets/logo_finance-analyst.png"
              alt="EnerTrack Logo"
              class="logo-icon"
            />
            <img
              src="../../assets/EnerTrack_text.png"
              alt="EnerTrack"
              class="logo-text"
            />
          </a>
          <div class="menu">
            <div class="menu-item" data-page="finance_overview.html">
              <svg
                viewBox="0 0 24 24"

                stroke-width="2"

            <div class="menu-item active" data-page="finance_subscription.html">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="5" width="20" height="14" rx="2" />

            </div>
            <div class="menu-item" data-page="finance_archives.html">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"

                <polyline points="21 8 21 21 3 21 3 8"></polyline>

        <div class="profile">
          <div class="profile-left">
            <img src="https://i.pravatar.cc/40?img=12" />
            <div>

              </div>
              <div class="profile-role" id="sidebarUserRole">

      <div class="content">
        <div class="container">
          <h1 class="welcome" id="welcomeHeading">Your EnerTrack subscription</h1>
          <div class="sub">
            What your organisation pays EnerTrack, and what it has saved. This
            is separate from Utility Costs, which is what you pay your
            electricity supplier.
          </div>

          <section id="subscriptionApp" aria-live="polite"></section>
        </div>
      </div>
    </div>

    <!-- api.js first: it defines window.api, which the module below uses. -->
    <script src="../../js/shared/api.js"></script>
    <script
      type="module"
      src="../../js/finance-analyst/subscriptionPage.js"
    ></script>
    <script src="../../js/shared/dashboardProfileMenu.js"></script>
