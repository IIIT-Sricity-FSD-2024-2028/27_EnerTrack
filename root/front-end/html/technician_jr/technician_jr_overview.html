<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnerTrack – My Overview</title>
    <link rel="stylesheet" href="../../css/shared/tech_shared.css" />
    <link rel="stylesheet" href="../../css/shared/tech_work_orders.css" />
    <link rel="stylesheet" href="../../css/technician_jr/tech_jr_overview.css" />
  </head>
  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div>
          <a href="../landing/landing.html" class="logo">
            <img
              src="../../assets/logo_technician.png"
              alt="EnerTrack Logo"
              class="logo-icon"
            />
            <img
              src="../../assets/EnerTrack_text.png"
              alt="EnerTrack"
              class="logo-text"
            />
          </a>
          <div class="nav-title">Navigation</div>
          <ul class="nav">
            <a href="technician_jr_overview.html"
              ><li class="active">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                </svg>
                Overview
              </li></a
            >
            <a href="technician_jr_work_orders.html"
              ><li>
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                  />
                  <rect x="8" y="2" width="8" height="4" rx="1" />
                  <line x1="9" y1="12" x2="15" y2="12" />
                  <line x1="9" y1="16" x2="13" y2="16" />
                </svg>
                My Work Orders
              </li></a
            >
          </ul>
        </div>
        <div class="profile" id="sidebarProfile">
          <img
            src="https://i.pravatar.cc/100"
            alt="Profile"
            id="sidebarUserImg"
          />
          <div>
            <div class="profile-name" id="sidebarUserName">Loading...</div>
            <div class="profile-role" id="sidebarUserRole">Technician</div>
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <div class="page-header">
          <h1 id="welcomeHeading">Welcome back</h1>
          <p>Here's what's on your board today.</p>
        </div>

        <!-- STAT CARDS -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">My Open Work Orders</div>
            <div class="stat-value" id="statOpen">—</div>
            <div class="stat-note" id="noteOpen">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">In Progress</div>
            <div class="stat-value" id="statInProgress">—</div>
            <div class="stat-note" id="noteInProgress">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Awaiting Review</div>
            <div class="stat-value" id="statReview">—</div>
            <div class="stat-note" id="noteReview">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Closed Work Orders</div>
            <div class="stat-value" id="statClosed">—</div>
            <div class="stat-note" id="noteClosed">—</div>
          </div>
        </div>

        <!-- UP NEXT -->
        <div class="card">
          <div class="feed-header">
            <div>
              <h2>Up next</h2>
              <small>Your highest-priority open work orders.</small>
            </div>
          </div>
          <div id="upNextList">
            <!-- Populated by JS -->
          </div>
        </div>
      </main>
    </div>

    <script src="../../js/shared/api.js"></script>
    <script src="../../js/technician_jr/overviewPage.js"></script>
    <script src="../../js/shared/roleRoutes.js"></script>
    <script src="../../js/shared/dashboardProfileMenu.js"></script>
  </body>
</html>
